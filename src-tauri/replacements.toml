# replacements.toml — Dicionário de normalização de texto para o Piper TTS
# Este arquivo mapeia abreviações, gírias da internet, siglas e símbolos
# para suas versões faladas por extenso, evitando que o Piper soletre letras isoladas.
#
# O usuário também pode criar ou sobrescrever em ~/.config/quicktrad/replacements.toml
# (ou %APPDATA%\quicktrad\replacements.toml no Windows) para adicionar palavras personalizadas.

