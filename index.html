<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quicktrad</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <textarea id="input" placeholder="Digite para traduzir" rows="1" autofocus></textarea>
    <div class="divider">
      <div class="lang-pill" id="lang-pill">
        <span id="lang-text">…</span>
        <button id="swap-btn" type="button" aria-label="Inverter idiomas">⇄</button>
        <button id="speak-btn" type="button" style="display: none;" aria-label="Ouvir tradução (Ctrl+R)" title="Ouvir tradução (Ctrl+R)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
      </div>

    </div>
    <div id="result" class="placeholder">Tradução</div>

  </body>
</html>
